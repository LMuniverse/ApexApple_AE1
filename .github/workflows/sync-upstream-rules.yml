name: Sync Upstream Rules

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Upstream Rules (with UA Bypass)
        run: |
          mkdir -p rule/loon rule

          # 1. Fetch AI.lsr (Loon format)
          echo "Fetching kelee.one AI.lsr..."
          curl -s -f -A "Clash.meta" "https://kelee.one/Tool/Loon/Lsr/AI.lsr" -o rule/loon/AI.lsr || echo "Warning: failed to fetch AI.lsr"

          # 2. Convert to Mihomo / Clash Classical format (.list)
          if [ -s rule/loon/AI.lsr ]; then
            python3 scripts/convert_rules.py rule/loon/AI.lsr rule/AI.list
          fi

          # 3. Fetch TikTok.yaml and optional conversions
          echo "Fetching kelee.one TikTok.yaml..."
          curl -s -f -A "Clash.meta" "https://kelee.one/Tool/Clash/Rule/TikTok.yaml" -o rule/TikTok.yaml || echo "Warning: failed to fetch TikTok.yaml"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rule/loon/AI.lsr rule/AI.list rule/TikTok.yaml
          
          if git diff --staged --quiet; then
            echo "No changes detected. Repository is up to date."
          else
            echo "Upstream rules changed! Committing and pushing..."
            git commit -m "chore(rules): sync upstream rules from kelee.one [skip ci]"
            git push
          fi
