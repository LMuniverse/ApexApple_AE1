[General]
ip-mode = v4-only
ipv6-vif = off
dns-server = 223.5.5.5, 119.29.29.29, https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://1.1.1.1/dns-query, https://8.8.8.8/dns-query
